<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Link to MP3 · Scanner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script>try{var t=localStorage.getItem('theme');if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header class="topbar"><div class="topbar-in">
  <span class="brand">Scanner</span>
  <nav class="tabs">
    <a href="/">Documents</a>
    <a href="/mp3.html" class="active">Link to MP3</a>
  </nav>
  <span class="spacer"></span>
  <button class="theme" id="themeBtn" onclick="toggleTheme()" aria-label="Toggle dark mode" title="Toggle dark mode">
    <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
  </button>
</div></header>

<main>
  <h1>Link to MP3</h1>
  <p class="sub">Paste a video link to download its audio.</p>

  <div class="card">
    <form class="field-row" onsubmit="toMp3(event)">
      <input type="text" id="yt" placeholder="https://" aria-label="Video link" autocomplete="off">
      <button class="btn primary" id="go" type="submit">Convert</button>
    </form>
    <div class="status" id="ytStatus" role="status"></div>
    <p class="note">Can take up to a minute. Only convert content you have the right to download.</p>
  </div>
</main>

<script>
function toggleTheme(){
  const el = document.documentElement;
  const dark = el.dataset.theme ? el.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  el.dataset.theme = dark ? 'light' : 'dark';
  try { localStorage.setItem('theme', el.dataset.theme); } catch {}
}
async function toMp3(e){
  e.preventDefault();
  const url = document.getElementById('yt').value.trim();
  const s = document.getElementById('ytStatus'), go = document.getElementById('go');
  s.className = 'status';
  if (!url) return;
  go.disabled = true; s.textContent = 'Converting…';
  try {
    const r = await fetch('/api/url-to-mp3', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({url})});
    if (!r.ok) { s.className = 'status error'; s.textContent = (await r.json()).detail || 'Conversion failed.'; return; }
    const a = document.createElement('a');
    a.href = URL.createObjectURL(await r.blob());
    a.download = 'audio.mp3'; a.click();
    s.textContent = 'Done. Your download has started.';
  } catch {
    s.className = 'status error'; s.textContent = 'Could not reach the server.';
  } finally { go.disabled = false; }
}
</script>
</body>
</html>
