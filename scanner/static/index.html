<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Documents · Scanner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script>try{var t=localStorage.getItem('theme');if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header class="topbar"><div class="topbar-in">
  <span class="brand">Scanner</span>
  <nav class="tabs">
    <a href="/" class="active">Documents</a>
    <a href="/mp3.html">Link to MP3</a>
  </nav>
  <span class="spacer"></span>
  <button class="theme" id="themeBtn" onclick="toggleTheme()" aria-label="Toggle dark mode" title="Toggle dark mode">
    <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
  </button>
</div></header>

<main>
  <h1>Documents</h1>
  <p class="sub">Upload a file to extract its text, convert it, or ask questions about it.</p>

  <label class="drop" id="drop">
    <strong id="dropTitle">Drop files here or click to browse</strong>
    <span>PDF, DOCX, TXT or image</span>
    <input type="file" id="file" multiple accept=".pdf,.docx,.txt,.png,.jpg,.jpeg,.tif,.tiff,.bmp,.webp">
  </label>

  <h2>Files</h2>
  <div class="list" id="rows"><div class="empty">Loading…</div></div>

  <div id="previewWrap" hidden>
    <h2>Extracted text</h2>
    <div class="preview">
      <div class="preview-head">
        <span class="meta" id="previewName"></span>
        <span>
          <button class="btn ghost" onclick="copyText()">Copy</button>
          <button class="btn ghost" onclick="closePreview()">Close</button>
        </span>
      </div>
      <pre id="text"></pre>
    </div>
  </div>
</main>

<button id="chatBtn" onclick="toggleChat()" title="Ask your documents" aria-label="Ask your documents">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/></svg>
</button>
<div id="chatBox">
  <div id="chatHead"><span>Ask your documents</span><button class="btn ghost" onclick="toggleChat()" aria-label="Close">✕</button></div>
  <div id="chatMsgs"><div class="msg bot">Hi! Ask me anything about the documents you've uploaded.</div></div>
  <form id="chatForm" onsubmit="sendChat(event)">
    <input id="chatInput" placeholder="Type a question…" autocomplete="off">
    <button class="btn primary" type="submit">Send</button>
  </form>
</div>

<div class="toast" id="toast"></div>

<script>
function toggleTheme(){
  const el = document.documentElement;
  const dark = el.dataset.theme ? el.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  el.dataset.theme = dark ? 'light' : 'dark';
  try { localStorage.setItem('theme', el.dataset.theme); } catch {}
}
const $ = id => document.getElementById(id);
const esc = s => s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtSize = b => b < 1024 ? b + ' B' : b < 1048576 ? (b/1024).toFixed(0) + ' KB' : (b/1048576).toFixed(1) + ' MB';
let activeId = null;

function toast(msg){
  const t = $('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('show'), 2800);
}

async function load(){
  const docs = await (await fetch('/api/documents')).json();
  $('rows').innerHTML = docs.length ? docs.map(d => `
    <div class="row ${d.id === activeId ? 'active' : ''}">
      <div class="info">
        <div class="name" title="${esc(d.original_name)}">${esc(d.original_name)}</div>
        <div class="meta">${fmtSize(d.size_bytes)} · ${new Date(d.created_at).toLocaleDateString()}</div>
      </div>
      <div class="actions">
        <button class="btn ghost" onclick="view(${d.id})">View text</button>
        <select id="fmt${d.id}" aria-label="Convert to">
          <option>pdf</option><option>docx</option><option>txt</option><option>png</option><option>jpg</option>
        </select>
        <button class="btn" onclick="convert(${d.id})">Convert</button>
        <button class="btn ghost danger" onclick="removeDoc(${d.id})">Delete</button>
      </div>
    </div>`).join('')
    : '<div class="empty">No documents yet. Upload one above to get started.</div>';
}

async function uploadFiles(files){
  for (const f of files){
    $('dropTitle').textContent = 'Scanning ' + f.name + '…';
    const fd = new FormData(); fd.append('file', f);
    try {
      const r = await fetch('/api/documents', {method:'POST', body: fd});
      if (r.ok) toast('Scanned ' + f.name);
      else toast((await r.json()).detail || 'Upload failed');
    } catch { toast('Could not reach the server'); }
  }
  $('dropTitle').textContent = 'Drop files here or click to browse';
  $('file').value = '';
  load();
}
$('file').addEventListener('change', e => e.target.files.length && uploadFiles([...e.target.files]));
const drop = $('drop');
['dragenter','dragover'].forEach(ev => drop.addEventListener(ev, e => {e.preventDefault(); drop.classList.add('over');}));
['dragleave','drop'].forEach(ev => drop.addEventListener(ev, e => {e.preventDefault(); drop.classList.remove('over');}));
drop.addEventListener('drop', e => e.dataTransfer.files.length && uploadFiles([...e.dataTransfer.files]));

async function view(id){
  const d = await (await fetch('/api/documents/' + id)).json();
  activeId = id;
  $('previewName').textContent = d.original_name;
  $('text').textContent = d.extracted_text || '(no text found)';
  $('previewWrap').hidden = false;
  $('previewWrap').scrollIntoView({behavior:'smooth', block:'nearest'});
  load();
}
function closePreview(){ activeId = null; $('previewWrap').hidden = true; load(); }
async function copyText(){ await navigator.clipboard.writeText($('text').textContent); toast('Copied'); }

function convert(id){ window.location = `/api/documents/${id}/convert?to=${$('fmt' + id).value}`; }

async function removeDoc(id){
  if (!confirm('Delete this document?')) return;
  await fetch('/api/documents/' + id, {method:'DELETE'});
  if (id === activeId) closePreview(); else load();
  toast('Deleted');
}

/* chat */
function toggleChat(){
  const box = $('chatBox'); box.classList.toggle('open');
  if (box.classList.contains('open')) $('chatInput').focus();
}
function addMsg(text, who){
  const m = document.createElement('div');
  m.className = 'msg ' + who; m.textContent = text;
  $('chatMsgs').appendChild(m); $('chatMsgs').scrollTop = 1e9;
  return m;
}
async function sendChat(e){
  e.preventDefault();
  const q = $('chatInput').value.trim(); if (!q) return;
  $('chatInput').value = ''; addMsg(q, 'user');
  const bot = addMsg('Thinking…', 'bot');
  try {
    const r = await fetch('/api/ask', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({question:q})});
    const d = await r.json();
    if (!r.ok) { bot.textContent = d.detail || 'Something went wrong.'; return; }
    bot.textContent = d.answer;
    if (d.sources && d.sources.length){
      const s = document.createElement('small'); s.textContent = 'Sources: ' + d.sources.join(', '); bot.appendChild(s);
    }
  } catch { bot.textContent = 'Could not reach the server.'; }
  $('chatMsgs').scrollTop = 1e9;
}

load();
</script>
</body>
</html>
